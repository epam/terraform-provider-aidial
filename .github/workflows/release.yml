name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions: {}

# A release run must finish; never cancel it because the same ref triggers again.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Protected environment: add required reviewers and move the signing secrets here
    # (see SECURITY.md).
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          # Resolve the newest patch, not the runner image's cached one, so stdlib fixes apply.
          check-latest: true
          # A release publishes artifacts, so do not restore a cache that PR runs could have poisoned.
          cache: false
      - name: Require signing secrets
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          PASSPHRASE: ${{ secrets.PASSPHRASE }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ] || [ -z "$PASSPHRASE" ]; then
            echo "GPG_PRIVATE_KEY and PASSPHRASE secrets are required to sign the release" >&2
            exit 1
          fi
      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      # The release description is the CHANGELOG section for this tag. Fail before
      # publishing anything when it is missing or empty.
      - name: Extract release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          awk -v v="$version" '
            /^## / { if (on) exit; if ($0 == "## " v || index($0, "## " v " ") == 1) on = 1; next }
            on
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/release-notes.md"; then
            echo "CHANGELOG.md has no non-empty '## $version' section" >&2
            exit 1
          fi
      # GoReleaser's sboms block shells out to syft. The GoReleaser and syft versions
      # match .devcontainer/Dockerfile and the goreleaser check step in ci.yml; bump them together.
      - name: Install syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.54.1
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.18.3
          args: release --clean --release-notes ${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
      # The signed SHA256SUMS file and its GPG signature remain the Terraform Registry
      # contract; the attestation covers every archive and SBOM it lists.
      - name: Locate checksums file
        id: checksums
        run: |
          set -euo pipefail
          file="$(ls dist/*_SHA256SUMS)"
          echo "path=$file" >> "$GITHUB_OUTPUT"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ${{ steps.checksums.outputs.path }}
      # SBOMs are not in SHA256SUMS (the Registry rejects releases that list them there),
      # so attest them directly.
      - name: Attest SBOMs
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.sbom.json
      # Check what was actually published, which is what the Registry ingests.
      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$dir"
          cd "$dir"
          gpg --verify ./*_SHA256SUMS.sig ./*_SHA256SUMS
          # The Registry rejects checksum files that list anything but zips and the manifest.
          if awk '{print $2}' ./*_SHA256SUMS | grep -v -E '\.zip$|_manifest\.json$'; then
            echo "SHA256SUMS lists files other than zips and the manifest" >&2
            exit 1
          fi
          sha256sum -c ./*_SHA256SUMS
          gh attestation verify ./*_linux_amd64.zip --repo "$GITHUB_REPOSITORY"
