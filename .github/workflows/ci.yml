name: CI

on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"
  TERRAFORM_VERSION: "1.12.0"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          # Resolve the newest patch, not the runner image's cached one, so stdlib fixes apply.
          check-latest: true
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
      - name: tfproviderlint
        run: |
          go install github.com/bflad/tfproviderlint/cmd/tfproviderlint@v0.31.0
          "$(go env GOPATH)/bin/tfproviderlint" ./...
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: terraform fmt
        run: terraform fmt -check -recursive
      - uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0

  goreleaser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Keep this version in sync with release.yml and .devcontainer/Dockerfile.
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.18.3
          args: check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          # Resolve the newest patch, not the runner image's cached one, so stdlib fixes apply.
          check-latest: true
      - run: go test ./... -count=1 -race

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          # Resolve the newest patch, not the runner image's cached one, so stdlib fixes apply.
          check-latest: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: Regenerate docs
        run: |
          go install github.com/hashicorp/terraform-plugin-docs/cmd/tfplugindocs@v0.22.0
          "$(go env GOPATH)/bin/tfplugindocs" generate --provider-name aidial
      - name: Fail on docs drift
        run: git diff --exit-code -- docs/

  # Builds the provider and validates every Terraform configuration against it
  # through dev_overrides on Linux and macOS (macOS only builds and validates).
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          # Resolve the newest patch, not the runner image's cached one, so stdlib fixes apply.
          check-latest: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: Build provider
        run: |
          mkdir -p "$RUNNER_TEMP/provider"
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o "$RUNNER_TEMP/provider/terraform-provider-aidial" .
      - name: Validate Terraform configurations
        env:
          TF_IN_AUTOMATION: "true"
        run: |
          cat > "$RUNNER_TEMP/terraformrc" <<EOF
          provider_installation {
            dev_overrides {
              "epam/aidial" = "$RUNNER_TEMP/provider"
            }
            direct {}
          }
          EOF
          export TF_CLI_CONFIG_FILE="$RUNNER_TEMP/terraformrc"
          for dir in tests/integration tests/integration-jwt stub/models; do
            (cd "$dir" && terraform validate)
          done

  # Applies tests/integration against a throwaway DIAL Core (plus Valkey) defined in
  # tests/core, so it needs no secrets and leaves no shared state. The URL and key are
  # passed with -var-file by scripts/test-integration.sh, not TF_VAR_*, so repository
  # variables cannot redirect the run to a real Core.
  integration:
    needs: [validate, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          # Resolve the newest patch, not the runner image's cached one, so stdlib fixes apply.
          check-latest: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: Integration run (Core, apply, drift check, destroy)
        env:
          CORE_VERSION: latest # release tag, intentionally unpinned
        run: scripts/test-integration.sh
      - name: Remove credentials file
        if: always()
        run: rm -f tests/integration/terraform.tfvars.json

  # Same ephemeral Core as `integration`, but authenticating only with this run's GitHub
  # Actions OIDC token (Core trusts it via the `github` identity provider in tests/core).
  # It is a separate job so that `id-token: write` is not granted to the long API-key job.
  # Fork and Dependabot pull requests get no OIDC token, so the job is skipped for them.
  integration-jwt:
    needs: [validate, test]
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: JWT integration run (OIDC token, Core, apply, destroy)
        env:
          CORE_VERSION: latest # release tag, intentionally unpinned
          # Must match `audience` in tests/core/docker-compose.yml.
          OIDC_AUDIENCE: aidial-ci
        run: |
          set -euo pipefail
          response="$(curl -sSf -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}")"
          token="$(printf '%s' "$response" | jq -r '.value')"
          if [ -z "$token" ] || [ "$token" = "null" ]; then
            echo "Could not obtain a GitHub OIDC token" >&2
            exit 1
          fi
          echo "::add-mask::${token}"
          AIDIAL_ID_TOKEN="$token" scripts/test-integration-jwt.sh
      - name: Remove credentials file
        if: always()
        run: rm -f tests/integration-jwt/terraform.tfvars.json
