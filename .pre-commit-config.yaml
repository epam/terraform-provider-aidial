repos:
  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: gofmt -w
        language: golang
        types: [go]
        pass_filenames: true

      - id: goimports
        name: goimports
        entry: goimports -w
        language: system
        types: [go]
        pass_filenames: true

      - id: golangci-lint
        name: golangci-lint
        entry: golangci-lint run
        language: system
        types: [go]
        pass_filenames: false

      - id: tfproviderlint
        name: tfproviderlint
        entry: tfproviderlint ./...
        language: system
        types: [go]
        pass_filenames: false

      - id: markdownlint
        name: markdownlint
        entry: markdownlint-cli2
        language: system
        types: [markdown]

      - id: terraform-fmt
        name: terraform fmt
        entry: terraform fmt -recursive
        language: system
        types: [terraform]
        pass_filenames: false
